name: Build - Piko Manual

on:
  workflow_dispatch:
    inputs:
      piko_ref:
        description: 'Piko branch or tag to build (default: dev, e.g. v3.12.0-dev.5)'
        required: false
        default: 'dev'
      force_build:
        description: 'Force build even if this version was already released'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up java
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Try building
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GRADLE_OPTS: -Dorg.gradle.caching=true
          PIKO_REF: ${{ inputs.piko_ref }}
          FORCE: ${{ inputs.force_build && '1' || '0' }}
        run: |
          mkdir -p bins
          uv run main.py
